services:
  web:
    build:
      context: .
      dockerfile: docker/Dockerfile
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__DefaultConnection: "Data Source=/app/data/desafio-benjamin.db"
      Ollama__BaseUrl: http://ollama:11434
    volumes:
      - app-data:/app/data
      - materials:/app/materials
    depends_on:
      - ollama
    restart: unless-stopped
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    # GPU acceleration requires host-specific configuration; CPU works by default.
volumes:
  app-data:
  materials:
  ollama-data:
